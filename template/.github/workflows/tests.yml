# Self-contained: installs from PyPI only and calls no other repository's workflow.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # To add a leg, extend the include list, e.g.
        #   - { os: windows-latest, python: "3.13" }
        #   - { os: ubuntu-latest, python: "3.11" }
        include:
          - { os: ubuntu-latest, python: "3.13" }
    env:
      CI: "true"
      TEST_TIER: fast
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Test
        run: python -m unittest discover
